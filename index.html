<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Water Navier-Stokes</title>
  <style>
    html, body { margin: 0; height: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; background: #06101a; color: #dfe9f3; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
    #ui { position: fixed; top: 12px; left: 12px; background: rgba(6, 16, 26, 0.72); backdrop-filter: blur(8px);
          border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 14px; min-width: 240px; }
    #ui h1 { margin: 0 0 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .row label { flex: 1; }
    .row output { width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
    input[type=range] { flex: 2; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    button { background: #15293d; color: #dfe9f3; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
             padding: 5px 10px; cursor: pointer; font: inherit; }
    button:hover { background: #1e3a55; }
    button.active { background: #2f7fd1; border-color: #5fa8ff; }
    #fps { position: fixed; right: 12px; top: 12px; font-size: 12px; opacity: 0.6; font-variant-numeric: tabular-nums; }
    #showui { position: fixed; top: 12px; left: 12px; display: none; width: 36px; height: 36px; padding: 0; font-size: 18px; }
    body.hideui #ui { display: none; }
    body.hideui #showui { display: block; }
    #hud { position: fixed; right: 18px; bottom: 18px; text-align: right; display: none; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    body.helm #hud { display: block; }
    #hud #knots { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    #hud .unit { font-size: 12px; opacity: 0.75; letter-spacing: 0.2em; text-transform: uppercase; }
    #hud #hdg { font-size: 13px; opacity: 0.8; margin-top: 6px; font-variant-numeric: tabular-nums; }
    #touchhint { position: fixed; inset: 0; display: none; pointer-events: none; }
    body.helm.touch #touchhint { display: flex; }
    #touchhint span { flex: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 28px;
      font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.45; }
    #touchhint span + span { border-left: 1px solid rgba(255,255,255,0.12); }
    body.helm #ui { opacity: 0.85; }
    .only3d { display: none; }
    body.helm .only3d { display: flex; }
    body.view3d .only3d { display: flex; }
    .hint { opacity: 0.7; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="fps"></div>
  <button id="showui">☰</button>
  <div id="hud"><div id="knots">0</div><div class="unit">knots</div><div id="hdg"></div></div>
  <div id="touchhint"><span>steer</span><span>throttle</span></div>
  <div id="ui">
    <h1>Water · Navier–Stokes (WebGL2)</h1>
    <div class="row">
      <label for="visc">Viscosity</label>
      <input id="visc" type="range" min="0" max="100" value="12" />
      <output id="viscOut"></output>
    </div>
    <div class="row">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="50" max="300" value="200" />
      <output id="speedOut"></output>
    </div>
    <div class="row">
      <label>View</label>
      <div class="btns" id="view">
        <button data-view="2d" class="active">2D</button>
        <button data-view="3d">3D</button>
        <button data-view="helm">Helm</button>
      </div>
    </div>
    <div class="row">
      <label>Damping</label>
      <div class="btns" id="damp">
        <button data-damp="0">None</button>
        <button data-damp="1" class="active">Low</button>
        <button data-damp="2">Medium</button>
        <button data-damp="3">High</button>
      </div>
    </div>
    <div class="row">
      <label for="splat">Brush size</label>
      <input id="splat" type="range" min="1" max="100" value="30" />
    </div>
    <div class="row only3d">
      <label for="swell">Swell</label>
      <input id="swell" type="range" min="0" max="100" value="70" />
    </div>
    <div class="row only3d">
      <label for="curl">Curl</label>
      <input id="curl" type="range" min="0" max="100" value="50" />
    </div>
    <div class="row only3d">
      <label for="height">Wave height</label>
      <input id="height" type="range" min="0" max="100" value="55" />
    </div>
    <div class="btns">
      <button id="boat" class="active">Boat</button>
      <button id="sound">Sound</button>
      <button id="hideui">Hide</button>
      <button id="reset">Reset</button>
      <button id="pause">Pause</button>
    </div>
    <div class="hint" id="hint">Drag with the mouse (or touch) to push the water. Walls reflect.</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
