<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1116" />
  <title>Seven Seas</title>
  <style>
    :root { --fg: #e4ebf0; --dim: rgba(228, 235, 240, 0.62); --amber: #e9b44c; }
    html, body { margin: 0; height: 100%; background: #0b1116; color: var(--fg); overflow: hidden;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #c:active { cursor: grabbing; }
    #vignette { position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,0.5) 100%); }

    #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.5s 0.6s; }
    body.playing #hud { opacity: 1; }
    #compass { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      width: min(440px, 64vw); height: 34px; }
    #minimap { position: absolute; left: calc(14px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
      width: 150px; height: 150px; }
    #gauges { position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom));
      display: flex; align-items: flex-end; gap: 16px; text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
    #speedbox { text-align: right; }
    #knots { font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .lbl { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }
    #sea { font-size: 12px; margin-top: 8px; color: var(--dim); font-variant-numeric: tabular-nums; }
    #sea b { color: var(--fg); font-weight: 600; }
    #controls { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #lever { width: 12px; height: 108px; border-radius: 6px; background: rgba(255,255,255,0.12); position: relative; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.12) inset; }
    #leverFill { position: absolute; left: 0; right: 0; background: var(--amber); }
    #leverZero { position: absolute; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.75); }
    #rudder { width: 64px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.12); position: relative; }
    #rudderNeedle { position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px; background: var(--fg); margin-left: -2px; }

    #buttons { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
      display: flex; gap: 6px; pointer-events: auto; }
    #buttons button { background: rgba(8, 14, 20, 0.5); color: var(--fg); border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; backdrop-filter: blur(6px); }
    #buttons button:hover { background: rgba(30, 45, 60, 0.7); }

    #toast { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: clamp(15px, 2.6vw, 22px);
      letter-spacing: 0.32em; text-transform: uppercase; opacity: 0; transition: opacity 0.9s; white-space: nowrap;
      text-shadow: 0 2px 14px rgba(0,0,0,0.9); padding-left: 0.32em; }
    #toast.show { opacity: 1; }
    #touchhint { position: absolute; inset: 0; display: none; opacity: 0; transition: opacity 1s; }
    body.touch #touchhint { display: flex; }
    body.touch.hint #touchhint { opacity: 1; }
    #touchhint div { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px;
      letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); }
    #touchhint div + div { border-left: 1px dashed rgba(255,255,255,0.2); }

    #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center; transition: opacity 1.6s;
      background: radial-gradient(ellipse at center, rgba(5,9,13,0.15), rgba(5,9,13,0.8)); }
    body.playing #start { opacity: 0; pointer-events: none; }
    #start h1 { font-size: clamp(42px, 10vw, 96px); letter-spacing: 0.4em; margin: 0; font-weight: 200; padding-left: 0.4em;
      text-shadow: 0 4px 30px rgba(0,0,0,0.7); }
    #start p { margin: 0; color: var(--dim); max-width: 520px; }
    #start .keys { font-size: 13px; color: var(--dim); line-height: 1.9; }
    #start kbd { display: inline-block; min-width: 18px; padding: 1px 6px; border: 1px solid rgba(255,255,255,0.25);
      border-radius: 5px; font: inherit; font-size: 12px; color: var(--fg); }
    #go { margin-top: 10px; background: rgba(233, 180, 76, 0.16); color: var(--fg); border: 1px solid var(--amber);
      border-radius: 999px; padding: 12px 34px; font: inherit; font-size: 15px; letter-spacing: 0.25em; text-transform: uppercase;
      cursor: pointer; padding-left: calc(34px + 0.25em); }
    #go:hover { background: rgba(233, 180, 76, 0.3); }
    .touchonly { display: none; }
    body.touch .touchonly { display: block; }
    body.touch .desktoponly { display: none; }
    #sea { white-space: nowrap; }
    @media (max-width: 560px) {
      #compass { top: calc(52px + env(safe-area-inset-top)); width: 86vw; }
      #minimap { width: 112px; height: 112px; }
      #knots { font-size: 38px; }
      #sea { font-size: 11px; }
    }
    #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <canvas id="compass"></canvas>
    <canvas id="minimap"></canvas>
    <div id="gauges">
      <div id="speedbox">
        <div id="knots">0</div>
        <div class="lbl">knots</div>
        <div id="sea"></div>
      </div>
      <div id="controls">
        <div id="lever"><div id="leverFill"></div><div id="leverZero"></div></div>
        <div id="rudder"><div id="rudderNeedle"></div></div>
      </div>
    </div>
    <div id="buttons">
      <button id="camBtn" title="Switch camera (C)">Chase cam</button>
      <button id="muteBtn" title="Sound on/off (M)">Mute</button>
      <button id="fsBtn" title="Fullscreen">⛶</button>
    </div>
    <div id="toast"></div>
    <div id="touchhint"><div>drag ⟷ steer</div><div>drag ↕ throttle</div></div>
  </div>

  <div id="start">
    <h1>SEVEN SEAS</h1>
    <p>A storm is building beyond the stacks. The bay is calm. The open sea is not.</p>
    <div class="keys desktoponly">
      <kbd>W</kbd> <kbd>S</kbd> throttle lever &nbsp;·&nbsp; <kbd>A</kbd> <kbd>D</kbd> helm &nbsp;·&nbsp; <kbd>X</kbd> all stop<br />
      <kbd>C</kbd> camera &nbsp;·&nbsp; drag to look around &nbsp;·&nbsp; <kbd>M</kbd> sound
    </div>
    <div class="keys touchonly">Left side: drag to steer · Right side: drag up and down to set the throttle</div>
    <button id="go">Cast off</button>
  </div>
  <div id="err"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
